name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    outputs:
      digest:
        value: ${{ jobs.oci.outputs.digest }}
      source:
        value: ${{ jobs.oci.outputs.source }}

env:
  GOTOOLCHAIN: local

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - name: Verify Dependencies
        run: |
          test "$(go env GOVERSION)" = "go1.27.1"
          go mod verify

      - name: Check Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted according to gofmt:"
            gofmt -d .
            exit 1
          fi

      - name: Vet Code
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race ./...

      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Check release publisher contract
        run: |
          bash -n scripts/publish-scanned-image.sh
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/persistence-policy.py

      - name: Build Binary
        run: go build -ldflags="-s -w" -o ./bin/linkup ./cmd/linkup

  oci:
    name: OCI artifact (no publication)
    needs: test
    outputs:
      digest: ${{ steps.artifact.outputs.digest }}
      source: ${{ steps.artifact.outputs.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Derive image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=verification-only
      - name: Exercise the same artifact path used by releases
        id: artifact
        uses: ./.github/actions/scanned-oci
        with:
          labels: ${{ steps.meta.outputs.labels }}

  artifact-roundtrip:
    needs: oci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linkup-oci-${{ github.run_id }}
          path: ${{ runner.temp }}/transfer
      - name: Reverify exact transferred bytes without registry write or rebuilding
        env:
          DIGEST: ${{ needs.oci.outputs.digest }}
          SOURCE: ${{ needs.oci.outputs.source }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y skopeo
          test "$(cat "$RUNNER_TEMP/transfer/linkup-oci-source.txt")" = "$SOURCE"
          test "$(cat "$RUNNER_TEMP/transfer/linkup-oci-digest.txt")" = "$DIGEST"
          tar -C "$RUNNER_TEMP/transfer" -xf "$RUNNER_TEMP/transfer/linkup-oci.tar"
          python3 scripts/oci-release.py verify --layout "$RUNNER_TEMP/transfer/linkup.oci" --digest "$DIGEST" --source "$SOURCE"
