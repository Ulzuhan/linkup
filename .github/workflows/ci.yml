name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    outputs:
      digest:
        value: ${{ jobs.oci-merge.outputs.digest }}
      source:
        value: ${{ jobs.oci-merge.outputs.source }}

env:
  GOTOOLCHAIN: local

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: true

      - name: Verify Dependencies
        run: |
          test "$(go env GOVERSION)" = "go1.27.4"
          go mod verify

      - name: Check Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted according to gofmt:"
            gofmt -d .
            exit 1
          fi

      - name: Vet Code
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race ./...

      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Check release publisher contract
        run: |
          bash -n scripts/publish-scanned-image.sh
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/persistence-policy.py

      - name: Build Binary
        run: go build -ldflags="-s -w" -o ./bin/linkup ./cmd/linkup

  oci:
    name: OCI artifact (linux/amd64)
    needs: test
    outputs:
      digest: ${{ steps.artifact.outputs.digest }}
      source: ${{ steps.artifact.outputs.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Derive image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=verification-only
      - name: Exercise the same artifact path used by releases
        id: artifact
        uses: ./.github/actions/scanned-oci
        with:
          arch: amd64
          labels: ${{ steps.meta.outputs.labels }}

  oci-arm64:
    name: OCI artifact (linux/arm64)
    needs: test
    outputs:
      digest: ${{ steps.artifact.outputs.digest }}
      source: ${{ steps.artifact.outputs.source }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Derive image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=verification-only
      - name: Exercise native arm64 build and scan
        id: artifact
        uses: ./.github/actions/scanned-oci
        with:
          arch: arm64
          labels: ${{ steps.meta.outputs.labels }}

  oci-merge:
    name: Merge multi-arch OCI layout
    needs: [oci, oci-arm64]
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
      source: ${{ steps.merge.outputs.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linkup-oci-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linkup-oci-arm64-${{ github.run_id }}
          path: ${{ runner.temp }}/arm64
      - id: merge
        name: Install skopeo, merge and verify multi-arch OCI
        env:
          AMD64_DIGEST: ${{ needs.oci.outputs.digest }}
          ARM64_DIGEST: ${{ needs.oci-arm64.outputs.digest }}
          AMD64_SOURCE: ${{ needs.oci.outputs.source }}
          ARM64_SOURCE: ${{ needs.oci-arm64.outputs.source }}
        run: |
          test "$AMD64_SOURCE" = "$ARM64_SOURCE"
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y skopeo
          tar -C "$RUNNER_TEMP/amd64" -xf "$RUNNER_TEMP/amd64/linkup-oci-amd64.tar"
          tar -C "$RUNNER_TEMP/arm64" -xf "$RUNNER_TEMP/arm64/linkup-oci-arm64.tar"
          merged=$(python3 scripts/oci-release.py merge \
            --amd64-layout "$RUNNER_TEMP/amd64/linkup.oci" --amd64-digest "$AMD64_DIGEST" \
            --arm64-layout "$RUNNER_TEMP/arm64/linkup.oci" --arm64-digest "$ARM64_DIGEST" \
            --source "$AMD64_SOURCE" --out "$RUNNER_TEMP/linkup.oci")
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/linkup-oci.tar" linkup.oci
          printf '%s\n' "$AMD64_SOURCE" > "$RUNNER_TEMP/linkup-oci-source.txt"
          printf '%s\n' "$merged" > "$RUNNER_TEMP/linkup-oci-digest.txt"
          cp "$RUNNER_TEMP/amd64/linkup-image-report.json" "$RUNNER_TEMP/linkup-image-report.json"
          echo "digest=$merged" >> "$GITHUB_OUTPUT"
          echo "source=$AMD64_SOURCE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linkup-oci-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/linkup-oci.tar
            ${{ runner.temp }}/linkup-oci-source.txt
            ${{ runner.temp }}/linkup-oci-digest.txt
            ${{ runner.temp }}/linkup-image-report.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  artifact-roundtrip:
    needs: oci-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linkup-oci-${{ github.run_id }}
          path: ${{ runner.temp }}/transfer
      - name: Reverify exact transferred bytes without registry write or rebuilding
        env:
          DIGEST: ${{ needs.oci-merge.outputs.digest }}
          SOURCE: ${{ needs.oci-merge.outputs.source }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y skopeo
          test "$(cat "$RUNNER_TEMP/transfer/linkup-oci-source.txt")" = "$SOURCE"
          test "$(cat "$RUNNER_TEMP/transfer/linkup-oci-digest.txt")" = "$DIGEST"
          tar -C "$RUNNER_TEMP/transfer" -xf "$RUNNER_TEMP/transfer/linkup-oci.tar"
          python3 scripts/oci-release.py verify --layout "$RUNNER_TEMP/transfer/linkup.oci" --digest "$DIGEST" --source "$SOURCE"
