# Publishing an image, and refusing to publish a bad one.
#
# Runs on tags only. The quality gate is Trivy: a HIGH or CRITICAL that HAS a
# fix available fails the job and nothing is pushed. Unfixable findings do not
# block — refusing to ship over something nobody can fix just teaches people to
# ignore the gate.
#
# The digest is printed in the job summary because that is what deployments pin.

name: Release image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build, scan and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # This exact build/scan/digest path is exercised by read-only PR CI too.
      - name: Build and verify the scanned OCI artifact
        id: build
        uses: ./.github/actions/scanned-oci
        with:
          labels: ${{ steps.meta.outputs.labels }}

      - name: Log in to GHCR only after the artifact passes verification
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the scanned artifact without rebuilding
        id: push
        env:
          RELEASE_LAYOUT: ${{ runner.temp }}/linkup.oci
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          export RELEASE_REPOSITORY="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          digest="$(bash scripts/publish-scanned-image.sh)"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Report the digest, which is what deployments pin
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
