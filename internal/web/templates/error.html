{{define "content"}}
<div class="container" style="max-width: 520px; padding-top: 3rem;">
  <div class="card" style="text-align: center;">
    <div style="width: 3.5rem; height: 3.5rem; border-radius: 50%; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: var(--accent-rose); display: flex; align-items: center; justify-content: center; font-size: 1.75rem; margin: 0 auto 1.25rem;">
      {{if eq .StatusCode 410}}⏳{{else}}⚠️{{end}}
    </div>

    <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">{{.Heading}}</h1>
    <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 2rem;">
      {{.Message}}
    </p>

    <div style="display: flex; gap: 1rem; justify-content: center;">
      <a href="/" class="btn btn-primary">
        🏠 Return to LinkUp Home
      </a>
    </div>
  </div>
</div>
{{end}}
