{{define "content"}}
<div class="container" style="max-width: 480px; padding-top: 3rem;">
  <div class="card" style="text-align: center;">
    <div style="width: 3.5rem; height: 3.5rem; border-radius: 50%; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); color: var(--accent-amber); display: flex; align-items: center; justify-content: center; font-size: 1.75rem; margin: 0 auto 1.25rem;">
      🔐
    </div>

    <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Confidential Link Locked</h1>
    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 2rem;">
      This destination is protected with a security PIN code. Enter the PIN to proceed.
    </p>

    {{if .Error}}
      <div style="background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.4); color: #fda4af; padding: 0.75rem; border-radius: 0.5rem; margin-bottom: 1.5rem; font-size: 0.85rem;">
        ⚠ {{.Error}}
      </div>
    {{end}}

    <form method="POST" action="/pin/{{.Slug}}">
      <div class="form-group">
        <label for="pin-input" class="form-label">Security PIN Code</label>
        <input 
          type="password" 
          id="pin-input" 
          name="pin" 
          class="form-input mono" 
          placeholder="••••" 
          required 
          autofocus 
          style="text-align: center; font-size: 1.5rem; letter-spacing: 0.25em;"
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; margin-bottom: 1rem;">
        Unlock & Redirect
      </button>

      <a href="/preview/{{.Slug}}" class="btn btn-secondary" style="width: 100%; font-size: 0.85rem;">
        👁️ View Safe Preview
      </a>
    </form>
  </div>
</div>
{{end}}
