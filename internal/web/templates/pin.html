{{define "content"}}
<div class="kc-workspace lk-public">
  <div class="container lk-narrow-xs">
    <div class="card lk-public-card">
      <h1>This link needs a PIN</h1>
      <p class="lk-public-sub">Whoever shared it with you has the PIN. Attempts are limited per link, not per visitor.</p>

      {{if .Error}}
        <div class="flash flash-err">⚠ {{.Error}}</div>
      {{end}}

      <form method="POST" action="/pin/{{.Slug}}">
        <div class="form-group">
          <label for="pin-input" class="form-label">PIN</label>
          <input type="password" id="pin-input" name="pin" class="form-input mono lk-pin-input" placeholder="••••" required autofocus autocomplete="one-time-code" inputmode="numeric">
        </div>
        <button type="submit" class="btn btn-primary btn-lg lk-block mb-1">Unlock</button>
        <a href="/preview/{{.Slug}}" class="btn btn-secondary lk-block">See where it goes first</a>
      </form>
    </div>
  </div>
</div>
{{end}}
