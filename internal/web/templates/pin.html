{{define "content"}}
<div class="container-sm dl">
  <div class="dl-hero rise">
    <span class="fi fi-lg" data-kind="pin" aria-hidden="true"><svg><use href="#i-lock"/></svg></span>
    <h1>This link needs a PIN</h1>
    <p class="dl-lede">Whoever shared it with you has it. The destination is shown only after the PIN, and attempts are limited per link, never per visitor.</p>
  </div>

  {{if .Error}}
  <div class="note" data-tone="danger" role="alert">
    <p class="note-title"><svg aria-hidden="true"><use href="#i-alert"/></svg>{{.Error}}</p>
  </div>
  {{end}}

  <form method="POST" action="/pin/{{.Slug}}" class="card card-pad pin-form">
    <label class="label" for="pin-input">PIN</label>
    <input type="password" id="pin-input" name="pin" class="input mono pin-input" placeholder="••••" required autofocus autocomplete="one-time-code" inputmode="numeric" spellcheck="false">
    <button type="submit" class="btn btn-primary btn-lg btn-block"><svg aria-hidden="true"><use href="#i-lock"/></svg>Unlock</button>
    <p class="dl-fine">Short link: <span class="mono">/{{.Slug}}</span></p>
  </form>
</div>
{{end}}
