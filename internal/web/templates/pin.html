{{define "content"}}
<div class="public">
  <div class="slip">
    <p class="kicker">Protected link</p>
    <h1 class="slip-title">This link needs a PIN</h1>
    <p class="slip-sub">Whoever shared it with you has it. The destination is shown only after the PIN, and attempts are limited per link, never per visitor.</p>

    {{if .Error}}
    <div class="notice notice-err" role="alert">
      <svg class="i" aria-hidden="true"><use href="#i-alert"/></svg>
      <p>{{.Error}}</p>
    </div>
    {{end}}

    <form method="POST" action="/pin/{{.Slug}}" class="pin-form">
      <label class="sr-only" for="pin-input">PIN</label>
      <input type="password" id="pin-input" name="pin" class="input input-mono pin-input" placeholder="••••" required autofocus autocomplete="one-time-code" inputmode="numeric" spellcheck="false">
      <button type="submit" class="btn btn-primary btn-lg btn-block">Unlock<svg class="i" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
    </form>
    <p class="hint">Short link: <span class="mono">/{{.Slug}}</span></p>
  </div>
</div>
{{end}}
